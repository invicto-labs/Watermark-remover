name: Windows release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out the exact release tag (or selected branch for a test build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Check version matches the release tag
        run: python scripts/release.py check
      - name: Install pinned runtime and build dependencies
        run: |
          python -m pip install -r requirements-ai.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Run all synthetic regression tests
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Download and verify the offline models
        run: |
          python download_model.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python download_text_model.py
      - name: Build the portable application and collect licenses
        run: python scripts/release.py build
      - name: Package, extract and test the actual Windows ZIP
        run: python scripts/release.py verify
      - name: Save verified package, checksums and build report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClearPage-Windows-verified
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Explain the result
        run: |
          'Windows package passed regression tests and extracted-package checks.' >> $env:GITHUB_STEP_SUMMARY
          'Download ClearPage-Windows-verified under this run’s Artifacts. Manual runs do not publish releases.' >> $env:GITHUB_STEP_SUMMARY

  attach:
    name: Attach verified files to the published release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download only the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ClearPage-Windows-verified
          path: release-assets
      - name: Upload without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          immutable=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.immutable // false')
          if [[ "$immutable" == true ]]; then
            echo '::error::This release is immutable. Download the verified files from the build artifact and attach them to a new draft release before publishing. No release was replaced.'
            exit 1
          fi
          # No --clobber: reruns must never silently overwrite a distributed build.
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GH_REPO"
